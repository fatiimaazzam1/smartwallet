name: smartwallet_mobile
description: "SmartWallet personal finance mobile application."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  dio: ^5.9.2
  flutter_secure_storage: ^10.3.1
  provider: ^6.1.5+1
  go_router: ^17.3.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: 0.14.4
  flutter_native_splash: 2.4.7

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/branding/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/smartwallet_launcher_icon.png
  min_sdk_android: 21
  adaptive_icon_background: "#0D1B2A"
  adaptive_icon_foreground: assets/branding/smartwallet_splash_logo.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#F1F5F9"
  image: assets/branding/smartwallet_splash_logo.png
  android: true
  ios: true
  web: false
  android_12:
    color: "#F1F5F9"
    image: assets/branding/smartwallet_splash_logo.png
