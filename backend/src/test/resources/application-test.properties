# Keep automated tests independent from the developer PostgreSQL database.
spring.datasource.url=jdbc:h2:mem:smartwallet_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# The context test validates Spring wiring and JPA mappings.
# PostgreSQL Flyway migrations are validated separately against PostgreSQL.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false

# Safe test-only values. These are not production secrets.
security.jwt.secret=U21hcnRXYWxsZXRUZXN0Snd0U2VjcmV0S2V5MzJCeXRlcw==
security.jwt.access-token-expiration-minutes=30
security.jwt.refresh-token-expiration-days=30

spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=
spring.mail.password=
spring.mail.properties[mail.smtp.auth]=false
spring.mail.properties[mail.smtp.starttls.enable]=false
app.mail.from=no-reply@smartwallet.test
